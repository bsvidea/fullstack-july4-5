<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="quiz.js"></script>
    <script>
        var qno=0;
        function showquestion()
        {
            var currentquestion=quizquestions[qno];
            document.getElementById("qobj").innerText=currentquestion['question'];
            document.getElementById("choice1").innerText=currentquestion['choices'][0];
            document.getElementById("choice2").innerText=currentquestion['choices'][1];
            document.getElementById("choice3").innerText=currentquestion['choices'][2];
            document.getElementById("choice4").innerText=currentquestion['choices'][3];
        }
        function shownext()
        {
            if(qno<19)
                qno++;
            else
                alert("Completed");
            showquestion();
        }
    </script>
</head>
<body onload="showquestion()">
    <div class="container mt-4">
        <div class="card bg-primary">
            <div class="card-header" id="qobj">
                Featured
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" id="choice1">An item</li>
                <li class="list-group-item" id="choice2">A second item</li>
                <li class="list-group-item" id="choice3">A third item</li>
                <li class="list-group-item" id="choice4">A third item</li>
            </ul>
            <div class="card-footer">
                <button onclick=shownext() class="btn btn-warning">Next</button>
            </div>
        </div>
    </div>
</body>
</html>
