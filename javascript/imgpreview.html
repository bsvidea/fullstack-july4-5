<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function showimage()
        {
            console.log(event.target.files[0]);
            var imgObject=document.getElementById("img1");
            var selectedFile=event.target.files[0];
            if(selectedFile['size']>1024*1024)
            {
                alert("Upload files less than 1 MB");
                return;
            }
            imgObject.src= URL.createObjectURL(selectedFile);
        }

        function showpdf()
        {
            var selectedFile=event.target.files[0];
            pdfPreview.src= URL.createObjectURL(selectedFile);
        }
    </script>
    <style>
        img
        {
            width: 20vw;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <label class="form-label fw-bold">Upload Image</label>
                <input type="file" class="form-control" id="ufile" 
                onchange=showimage() accept="image/*">
            </div>
            <div class="col">
                <img id="img1" class="rounded d-block mx-auto">
            </div>
        </div>

         <div class="row">
            <div class="col">
                <label class="form-label fw-bold">Upload Pdf</label>
                <input type="file" class="form-control" id="ufile" 
                onchange=showpdf() accept="pdf/*">
            </div>
            <div class="col">
                <iframe id="pdfPreview"></iframe>
            </div>
        </div>
    </div>    
</body>
</html>
